[project]
name = "dsa"
version = "0.1.0"
description = "A structured system for mastering algorithms and data structures"
requires-python = ">=3.12"
authors = [{ name = "Angelito Chagas", email = "chagasangelito@gmail.com" }]
dependencies = []

[dependency-groups]
dev = [
  "clang-format>=22.1",
  "dprint-py==0.55.2.0",
  "ruff>=0.15",
  "shfmt-py==4.2.0",
]

[tool.uv]
package = false
required-version = "==0.11.21"

[tool.ruff]
line-length = 88
extend-exclude = ["buffers"]
cache-dir = ".cache/ruff"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
